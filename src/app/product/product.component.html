
<section class="border border-5 border-black rounded bg-success-subtle p-5 my-5">

    <h1 class="p-5 text-capitalize text-primary"> Product List :</h1>
<div class="container">
    <div class="row">
        <hr>

        @for (product of products; track $index) {

            <div class="col-sm-12 col-md-6 col-lg-3 g-4">
            <div class="card border border-warning overflow-hidden">
                <img [src]="product.imgSrc"class="card-img" [alt]="product.altAttr"><br>
                
                <div class="card-body ">
                   
                    <h5>{{product.descript}}</h5>
                    <h6 class="text-danger">......................................................................</h6>
                    <div class="d-flex justify-content-center ">
                     <p class=" lead bg-warning rounded w-50 p-2 text-center">price: {{product.price}} </p>
                     <div class="pt-2 ms-3">
                        <i class="fa-solid fa-star" style="color: #0c0916;"></i>      
                        <i class="fa-solid fa-star" style="color: #0c0916;"></i>   
                        <i class="fa-solid fa-star" style="color: #0c0916;"></i>      
                        <i class="fa-solid fa-star" style="color: #0c0916;"></i>  
                        <i class="fa-solid fa-star-half-stroke"></i>
                       </div>

                    </div>
                  
                   
                </div>
            </div>
        </div>
        }
        
    </div>
</div>
</section>


<app-end></app-end>
